[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-auditor"
version = "0.1.0"
description = "Autonomous trace auditor for local LLM traffic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.14",
    "langfuse>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "python-dotenv"
]
